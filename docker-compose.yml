services:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: home-scout-db
    environment:
      ACCEPT_EULA: ${DB_ACCEPT_EULA}
      SA_PASSWORD: ${DB_SA_PASSWORD}
      MSSQL_PID: ${DB_MSSQL_PID}
    ports:
      - "1436:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - home-scout-network
    healthcheck:
      test: >
        /bin/bash -c "/opt/mssql-tools18/bin/sqlcmd
        -S localhost
        -U sa
        -P \"$$SA_PASSWORD\"
        -C
        -Q \"SELECT 1\""
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: home-scout-db-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      SA_PASSWORD: ${DB_SA_PASSWORD}
    volumes:
      - ./src/Home.Scout.Infrastructure/Data/Scripts:/scripts
    networks:
      - home-scout-network
    entrypoint: /bin/bash
    command: >
      -c "echo 'Running init SQL script...';
      /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P \"$$SA_PASSWORD\" -C -i /scripts/001_Initial_Schema.sql"

  web:
    build:
      context: .
      dockerfile: src/Home.Scout.Web/Dockerfile
    container_name: home-scout-web
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
    ports:
      - "8080:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - home-scout-network
    restart: unless-stopped

  background-rss-worker:
    build:
      context: .
      dockerfile: src/Home.Scout.Background.Rss/Dockerfile
    container_name: home-scout-rss-worker
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - home-scout-network
    restart: unless-stopped

volumes:
  mssql_data:

networks:
  home-scout-network:
    driver: bridge