services:

  db:
    image: postgres:16-alpine
    container_name: home-scout-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/Home.Scout.Infrastructure/Data/Scripts:/docker-entrypoint-initdb.d
    networks:
      - home-scout-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/Home.Scout.Web/Dockerfile
    container_name: home-scout-web
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
    ports:
      - "${WEB_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - home-scout-network
    restart: unless-stopped

  background-rss-worker:
    build:
      context: .
      dockerfile: src/Home.Scout.Background.Rss/Dockerfile
    container_name: home-scout-rss-worker
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - home-scout-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  home-scout-network:
    driver: bridge
