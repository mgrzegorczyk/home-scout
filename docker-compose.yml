version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: home-scout-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourPassword123!"
      MSSQL_PID: "Developer"
    ports:
      - "1436:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - home-scout-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourPassword123!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: home-scout-db-init
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src/Home.Scout.Web/Data/Scripts:/scripts
    networks:
      - home-scout-network
    entrypoint: /bin/bash
    command: -c "
      echo 'Running init SQL script...' &&
      /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P 'YourPassword123!' -C -i /scripts/001_Initial_Schema.sql
      "

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: home-scout-web
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=HomeScout;User Id=sa;Password=YourPassword123!;TrustServerCertificate=True;"
    ports:
      - "8080:8080"
    depends_on:
      - db-init
    networks:
      - home-scout-network
    restart: unless-stopped

volumes:
  mssql_data:

networks:
  home-scout-network:
    driver: bridge
